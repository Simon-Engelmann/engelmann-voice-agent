<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Engelmann Voice Agent</title>
<style>
:root{--pulse:.12}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 38%,#eaf4ff 0,#fff 42%,#fbfbfd 100%);color:#1d1d1f;min-height:100dvh;display:grid;place-items:center;overflow:hidden}.card{width:min(560px,90vw);text-align:center}.circle{position:relative;width:min(430px,78vw);height:min(430px,78vw);border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 28px 90px rgba(0,72,180,calc(.12 + var(--pulse)));margin:0 auto 20px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.8)}.circle.speaking{transform:translateY(-5px)}video{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s ease}.show{opacity:1}#fallback{position:absolute;inset:0;display:grid;place-items:center;color:#6e6e73;padding:28px;white-space:pre-wrap}.pill{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);color:#6e6e73}.dot{width:8px;height:8px;border-radius:50%;background:#c7c7cc}.ok .dot{background:#34c759}.bad .dot{background:#ff3b30}.bubble{margin-top:14px;padding:12px 14px;border-radius:18px;background:#f1f1f4;text-align:left;white-space:pre-wrap;min-height:48px;max-height:28vh;overflow:auto}button{margin-top:16px;border:0;border-radius:16px;background:#007aff;color:white;font:inherit;font-weight:700;padding:14px 18px;min-width:180px}.small{font-size:12px;color:#b0b0b7;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <div id="circle" class="circle"><video id="avatarVideo" autoplay playsinline muted></video><div id="fallback">Lade LemonSlice...</div></div>
  <div id="pill" class="pill"><span class="dot"></span><span id="status">Lade App...</span></div>
  <div id="log" class="bubble">Bereit.</div>
  <button id="startBtn">Starten</button>
  <div class="small">LemonSlice + eigene Stimme</div>
</div>
<script type="module">
const LIVEKIT_URL='https://esm.sh/livekit-client@2.15.13';
const PCM_RATE=16000;
const DEFAULT_INSTRUCTIONS=`Du bist Simons deutscher Voice-Agent und als sichtbarer LemonSlice-Avatar in der App zu sehen. Du sprichst mit Simons eigener geklonter Stimme. Antworte immer Deutsch, kurz, klar, nüchtern und trocken-humorig. Maximal 1 bis 3 Sätze. Keine KI-Floskeln. Kein "Gerne", kein "Natürlich", kein "Als KI". Wenn Simon Unsinn sagt, widersprich kurz und ruhig. Sprich Mimik nicht aus.`;
const PROMPTS={natural:'A calm attentive German assistant. Neutral face, natural eye contact, subtle head movement, no forced smile.',neutral:'A calm attentive German assistant. Neutral face, natural eye contact, subtle head movement, no forced smile.',happy:'A relaxed friendly assistant. Small genuine smile, light energy, warm eye contact, natural gestures.',doubtful:'A skeptical but calm assistant. Slightly raised eyebrow, focused eyes, reserved mouth, thoughtful head tilt.',angry:'A strict serious assistant. Firm expression, focused eyes, controlled intensity, no smile, professional restraint.'};
const $=id=>document.getElementById(id);const video=$('avatarVideo'),fallback=$('fallback'),status=$('status'),pill=$('pill'),log=$('log'),btn=$('startBtn'),circle=$('circle');
let pc,dc,lkRoom,lkDest,avatarSessionId,audioCtx,activeSource,responseText='',aiBubble='',currentEmotion='natural',lastEmotion=0;
function setStatus(t,m=''){status.textContent=t;pill.classList.toggle('ok',m==='ok');pill.classList.toggle('bad',m==='bad')}
function sayLog(t){log.textContent=t;log.scrollTop=log.scrollHeight}
function appendAi(t){aiBubble+=t;responseText+=t;sayLog(aiBubble);autoEmotion(responseText)}
function speakUI(on){circle.classList.toggle('speaking',on);document.documentElement.style.setProperty('--pulse',on?'.28':'.12')}
function norm(v){const r=String(v||'natural').toLowerCase();if(r.includes('angry')||r.includes('streng')||r.includes('wut'))return'angry';if(r.includes('doubt')||r.includes('skept')||r.includes('frag'))return'doubtful';if(r.includes('happy')||r.includes('freu')||r.includes('locker'))return'happy';if(r.includes('neutral'))return'neutral';return'natural'}
function detect(t){t=String(t||'').toLowerCase();if(/falsch|unsinn|quatsch|nein|kritisch|problem|fehler|stopp|nicht korrekt/.test(t))return'angry';if(/vielleicht|pruefen|unklar|skeptisch|zweifel|nicht sicher|fraglich/.test(t))return'doubtful';if(/gut|laeuft|passt|super|sauber|perfekt|witz|klappt/.test(t))return'happy';return'natural'}
function getCtx(){const C=window.AudioContext||window.webkitAudioContext;audioCtx=audioCtx||new C({sampleRate:PCM_RATE});if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}
async function startAvatar(emotion='natural'){
 try{setStatus('Lade LemonSlice...');const e=norm(emotion);const res=await fetch('/avatar/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emotion:e,agent_prompt:PROMPTS[e]})});const s=await res.json().catch(()=>({}));if(!res.ok||!s.livekit_url||!s.livekit_token)throw new Error(s.error||JSON.stringify(s));avatarSessionId=s.session_id;currentEmotion=e;const sdk=await import(LIVEKIT_URL);const room=new sdk.Room({adaptiveStream:true,dynacast:true});room.on(sdk.RoomEvent.TrackSubscribed,(track)=>{if(track.kind===sdk.Track.Kind.Video){const el=track.attach(video);el.autoplay=true;el.playsInline=true;el.muted=true;el.classList.add('show');fallback.style.display='none'}if(track.kind===sdk.Track.Kind.Audio)track.attach()});await room.connect(s.livekit_url,s.livekit_token);lkRoom=room;lkDest=getCtx().createMediaStreamDestination();await room.localParticipant.publishTrack(lkDest.stream.getAudioTracks()[0],{name:'assistant-audio'});setStatus('LemonSlice aktiv','ok')}catch(e){fallback.textContent='LemonSlice nicht verbunden.\n'+String(e.message||e);setStatus('Avatar Fehler','bad');console.warn(e)}}
async function setEmotion(emotion){const e=norm(emotion);if(!avatarSessionId||e===currentEmotion||Date.now()-lastEmotion<900)return;currentEmotion=e;lastEmotion=Date.now();setStatus('Mimik: '+e);try{await fetch('/avatar/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:avatarSessionId,emotion:e,agent_prompt:PROMPTS[e]})});setStatus('LemonSlice aktiv','ok')}catch(err){console.warn(err)}}
function autoEmotion(t){if(t.length<18)return;const e=detect(t);if(e!==currentEmotion)setEmotion(e)}
function stopSpeech(){try{activeSource?.stop()}catch(_){}activeSource=null;speakUI(false)}
function playPcm(pcm){const ctx=getCtx();const b=ctx.createBuffer(1,pcm.length,PCM_RATE);const ch=b.getChannelData(0);for(let i=0;i<pcm.length;i++)ch[i]=Math.max(-1,Math.min(1,pcm[i]/32768));const src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);if(lkDest)src.connect(lkDest);activeSource=src;speakUI(true);src.onended=()=>{if(activeSource===src)activeSource=null;speakUI(false)};src.start()}
async function speakText(text){text=String(text||'').replace(/\s+/g,' ').trim();if(!text)return;stopSpeech();await setEmotion(detect(text));setStatus('Spricht · eigene Stimme','ok');try{const r=await fetch('/tts/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw new Error(await r.text());const ab=await r.arrayBuffer();playPcm(new Int16Array(ab))}catch(e){sayLog('Stimme Fehler: '+String(e.message||e));setStatus('Stimme Fehler','bad')}}
function extractDone(msg){try{for(const item of msg.response.output||[])for(const p of item.content||[])if(p.text||p.transcript)return p.text||p.transcript}catch(_){}return''}
async function connect(){setStatus('Verbinde Stimme...');const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});pc=new RTCPeerConnection();stream.getTracks().forEach(t=>pc.addTrack(t,stream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{setStatus('Bereit · eigene Stimme','ok');sayLog('Bereit. LemonSlice aktiv.');const gs=['Begruesse Simon kurz: Moin Simon. Gesicht online, Wuerde im Beta-Status.','Begruesse Simon kurz: Hi Simon. Avatar laeuft. Jetzt fehlt nur noch ein guter Grund.','Begruesse Simon kurz: Simon, da bist du ja. Ich schaue neutral, wie ein sehr teurer Toaster.'];dc.send(JSON.stringify({type:'response.create',response:{modalities:['text'],instructions:gs[Math.floor(Math.random()*gs.length)]}}))};dc.onmessage=e=>handleEvent(e.data);dc.onerror=()=>setStatus('DataChannel-Fehler','bad');pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected')setStatus('Bereit · eigene Stimme','ok');if(['failed','disconnected'].includes(pc.connectionState))setStatus('Verbindung weg','bad')};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/rtc-answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:offer.sdp,instructions:DEFAULT_INSTRUCTIONS})});const answer=await r.text();if(!r.ok)throw new Error(answer);await pc.setRemoteDescription({type:'answer',sdp:answer})}
function handleEvent(raw){let msg;try{msg=JSON.parse(raw)}catch{return}const type=msg.type||'';if(type==='response.created'){responseText='';aiBubble='';speakUI(true)}if(type==='input_audio_buffer.speech_started'||type==='conversation.interrupted')stopSpeech();if((type==='response.output_text.delta'||type==='response.text.delta'||type==='response.audio_transcript.delta')&&msg.delta)appendAi(msg.delta);if(type==='response.done'){if(!responseText)responseText=extractDone(msg);speakText(responseText)}if(type==='conversation.item.input_audio_transcription.completed'&&msg.transcript){sayLog('Du: '+msg.transcript);setEmotion(detect(msg.transcript))}if(type==='error')sayLog(msg.error?.message||JSON.stringify(msg))}
btn.onclick=async()=>{try{btn.disabled=true;getCtx();await connect()}catch(e){btn.disabled=false;fallback.textContent=String(e.message||e);setStatus('Start Fehler','bad')}};
startAvatar();
</script>
</body>
</html>
