<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Engelmann Voice Agent</title>
  <style>
    :root{--bg:#fbfbfd;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--blue:#007aff;--green:#34c759;--red:#ff3b30;--glass:rgba(255,255,255,.78);--pulse:.12}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:radial-gradient(circle at 50% 38%,rgba(219,236,255,.96) 0,#fff 42%,var(--bg) 100%);color:var(--text)}.app{position:relative;min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:hidden}.aurora{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(circle at 25% 30%,rgba(0,122,255,.10),transparent 28%),radial-gradient(circle at 72% 38%,rgba(52,199,89,.10),transparent 30%),radial-gradient(circle at 50% 75%,rgba(90,200,250,.12),transparent 26%);filter:blur(18px);animation:aurora 12s ease-in-out infinite alternate}@keyframes aurora{from{transform:translate3d(-1%,-1%,0) scale(1)}to{transform:translate3d(1.5%,1%,0) scale(1.04)}}.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 24px)}.pill{display:flex;align-items:center;gap:8px;min-height:34px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 10px 28px rgba(0,0,0,.06);color:var(--muted);font-size:13px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:99px;background:#c7c7cc;flex:0 0 auto}.ok .dot{background:var(--green);box-shadow:0 0 0 6px rgba(52,199,89,.12)}.bad .dot{background:var(--red);box-shadow:0 0 0 6px rgba(255,59,48,.12)}.stage{position:relative;display:grid;place-items:center;width:min(88vw,540px);height:min(88vw,540px);isolation:isolate;transition:transform .18s ease}.stage.speaking{transform:translateY(-5px)}.stage:before{content:"";position:absolute;width:78%;height:78%;border-radius:50%;background:radial-gradient(circle at 42% 32%,rgba(255,255,255,.90),rgba(255,255,255,.46) 46%,rgba(0,122,255,.07) 72%,transparent 100%);box-shadow:0 32px 90px rgba(0,72,180,calc(.10 + var(--pulse))),inset 0 1px 0 rgba(255,255,255,.90);z-index:-1;animation:halo 5.8s ease-in-out infinite}@keyframes halo{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.04);opacity:1}}#avatarFrame{width:78%;height:78%;position:relative;border-radius:50%;overflow:hidden;transform:translateZ(0);clip-path:circle(50% at 50% 50%);background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}#simliVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;background:transparent;opacity:0;transition:opacity .25s ease}#simliVideo.show{opacity:1}.avatarPlaceholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:28px}.hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#b0b0b7;font-size:12px;text-align:center;z-index:5}.hint:before{content:"";display:block;width:42px;height:5px;background:#d1d1d6;border-radius:4px;margin:0 auto 8px}.sheet{position:fixed;left:0;right:0;bottom:0;height:min(74dvh,700px);z-index:20;transform:translateY(calc(100% - 56px));transition:transform .28s cubic-bezier(.2,.8,.2,1);border-radius:30px 30px 0 0;background:rgba(255,255,255,.96);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--line);box-shadow:0 -28px 70px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden}.sheet.open{transform:translateY(0)}@media (min-width:760px){.sheet{left:50%;right:auto;width:720px;transform:translate(-50%,calc(100% - 56px))}.sheet.open{transform:translate(-50%,0)}}.handle-wrap{padding:10px 18px 8px;text-align:center}.handle{width:48px;height:5px;border-radius:6px;background:#d1d1d6;margin:0 auto 8px}.chat-title{font-weight:700;font-size:15px}.log{flex:1;overflow:auto;padding:10px 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}.bubble{max-width:88%;padding:11px 13px;border-radius:18px;line-height:1.35;font-size:15px;white-space:pre-wrap}.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}.ai{align-self:flex-start;background:#f1f1f4;color:var(--text);border-bottom-left-radius:6px}.system{align-self:center;max-width:94%;background:#fff8dc;color:#6b5b00;font-size:13px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:22px;z-index:60;background:rgba(251,251,253,.66);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.modal.show{display:grid}.card{width:min(430px,100%);padding:26px;border-radius:28px;background:rgba(255,255,255,.95);box-shadow:0 24px 70px rgba(0,0,0,.14);border:1px solid var(--line);text-align:center}.card h1{margin:0 0 8px;font-size:24px;letter-spacing:-.02em}.card p{margin:0 0 16px;color:var(--muted);line-height:1.38}button{width:100%;min-height:50px;border:0;border-radius:16px;padding:12px 14px;font:inherit;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.error{margin-top:12px;padding:10px;border-radius:14px;background:#fff1f0;color:#9f1c15;font-size:13px;text-align:left;white-space:pre-wrap;display:none}.error.show{display:block}
  </style>
</head>
<body>
  <div id="root" class="app">
    <div class="aurora"></div>
    <div class="top"><div id="statusPill" class="pill"><span class="dot"></span><span id="statusText">Lade Avatar...</span></div></div>
    <div id="stage" class="stage"><div id="avatarFrame"><video id="simliVideo" autoplay playsinline muted></video><div id="avatarPlaceholder" class="avatarPlaceholder">Avatar wird geladen...</div></div></div>
    <div class="hint">Nach oben wischen für Verlauf</div>
  </div>
  <section id="chatSheet" class="sheet"><div id="chatHandle" class="handle-wrap"><div class="handle"></div><div class="chat-title">Verlauf</div></div><div id="chatLog" class="log"></div></section>
  <div id="startModal" class="modal"><div class="card"><h1>Zum Starten tippen</h1><p>Der Browser braucht einmal deine Freigabe für Mikrofon und Audio.</p><button id="startBtn" type="button">Einmal tippen</button><div id="startError" class="error"></div></div></div>
  <script src="/app.js?v=external-voice-1"></script>
</body>
</html>
