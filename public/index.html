<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Engelmann Voice Agent</title>
<style>
:root{--bg:#fbfbfd;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--glass:rgba(255,255,255,.76);--ok:#34c759;--bad:#ff3b30;--blue:#007aff;--pulse:.12}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% 36%,rgba(222,238,255,.98),#fff 46%,var(--bg) 100%)}.app{position:relative;min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:hidden}.aurora{position:absolute;inset:-20%;background:radial-gradient(circle at 24% 34%,rgba(0,122,255,.10),transparent 26%),radial-gradient(circle at 76% 38%,rgba(52,199,89,.10),transparent 30%),radial-gradient(circle at 50% 76%,rgba(90,200,250,.13),transparent 28%);filter:blur(18px);animation:float 12s ease-in-out infinite alternate;pointer-events:none}@keyframes float{from{transform:translate3d(-1%,-1%,0) scale(1)}to{transform:translate3d(1.5%,1%,0) scale(1.04)}}.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;max-width:calc(100vw - 24px)}.pill{display:flex;align-items:center;gap:8px;min-height:34px;padding:7px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 10px 28px rgba(0,0,0,.06);font-size:13px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:99px;background:#c7c7cc;flex:0 0 auto}.pill.ok .dot{background:var(--ok);box-shadow:0 0 0 6px rgba(52,199,89,.12)}.pill.bad .dot{background:var(--bad);box-shadow:0 0 0 6px rgba(255,59,48,.12)}.stage{position:relative;width:min(88vw,540px);height:min(88vw,540px);display:grid;place-items:center;isolation:isolate;transition:transform .22s ease}.stage.speaking{transform:translateY(-6px)}.stage:before{content:"";position:absolute;width:78%;height:78%;border-radius:50%;background:radial-gradient(circle at 42% 32%,rgba(255,255,255,.92),rgba(255,255,255,.48) 47%,rgba(0,122,255,.07) 72%,transparent 100%);box-shadow:0 32px 90px rgba(0,72,180,calc(.10 + var(--pulse))),inset 0 1px 0 rgba(255,255,255,.9);z-index:-1;animation:halo 5.8s ease-in-out infinite}@keyframes halo{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.04);opacity:1}}#avatarFrame{position:relative;width:78%;height:78%;border-radius:50%;overflow:hidden;transform:translateZ(0);background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}#avatarVideo,#avatarCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;background:transparent;opacity:0;transition:opacity .2s ease;z-index:2}#avatarVideo.show,#avatarCanvas.show{opacity:1}.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:30px;color:var(--muted);font-size:14px;text-align:center;white-space:pre-wrap;line-height:1.35;z-index:4}.hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;color:#b0b0b7;font-size:12px;text-align:center;user-select:none}.hint:before{content:"";display:block;width:42px;height:5px;background:#d1d1d6;border-radius:4px;margin:0 auto 8px}.sheet{position:fixed;left:0;right:0;bottom:0;height:min(74dvh,700px);z-index:30;transform:translateY(calc(100% - 56px));transition:transform .28s cubic-bezier(.2,.8,.2,1);border-radius:30px 30px 0 0;background:rgba(255,255,255,.96);border:1px solid var(--line);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 -28px 70px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden}.sheet.open{transform:translateY(0)}@media (min-width:760px){.sheet{left:50%;right:auto;width:720px;transform:translate(-50%,calc(100% - 56px))}.sheet.open{transform:translate(-50%,0)}}.handle-wrap{padding:10px 18px 8px;text-align:center;user-select:none}.handle{width:48px;height:5px;border-radius:6px;background:#d1d1d6;margin:0 auto 8px}.chat-title{font-weight:700;font-size:15px}.log{flex:1;overflow:auto;padding:10px 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}.entry{max-width:94%;padding:10px 12px;border-radius:16px;line-height:1.35;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.sys{align-self:center;background:#fff8dc;color:#6b5b00;font-size:13px}.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}.ai{align-self:flex-start;background:#f1f1f4;color:var(--text);border-bottom-left-radius:6px}.err{align-self:center;background:#fff1f0;color:#9f1c15;font-size:13px}.debug{align-self:center;background:#eef6ff;color:#20466b;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.tapLayer{position:fixed;inset:0;z-index:5;background:transparent;display:none}.tapLayer.show{display:block}
</style>
</head>
<body>
<div id="root" class="app">
  <div class="aurora"></div>
  <div class="top"><div id="pill" class="pill"><span class="dot"></span><span id="status">Lade App...</span></div></div>
  <div id="stage" class="stage"><div id="avatarFrame"><video id="avatarVideo" autoplay playsinline muted></video><canvas id="avatarCanvas"></canvas><div id="fallback" class="fallback">Lade LemonSlice...</div></div></div>
  <div class="hint">Nach oben wischen für Verlauf</div>
  <div id="tapLayer" class="tapLayer"></div>
</div>
<section id="sheet" class="sheet"><div id="sheetHandle" class="handle-wrap"><div class="handle"></div><div class="chat-title">Verlauf</div></div><div id="log" class="log"></div></section>
<script type="module">
const LIVEKIT_URL='https://esm.sh/livekit-client@2.15.13';
const PCM_RATE=16000;
const DEFAULT_INSTRUCTIONS=`Du bist Simons deutscher Voice-Agent und als sichtbarer LemonSlice-Avatar in der App zu sehen. Du sprichst mit Simons eigener geklonter Stimme. Antworte immer Deutsch, kurz, klar, nüchtern und trocken-humorig. Maximal 1 bis 3 Sätze. Keine KI-Floskeln. Kein "Gerne", kein "Natürlich", kein "Als KI". Wenn Simon Unsinn sagt, widersprich kurz und ruhig. Sprich Mimik nicht aus.`;
const PROMPTS={natural:'A calm attentive German assistant. Neutral face, natural eye contact, subtle head movement, no forced smile.',neutral:'A calm attentive German assistant. Neutral face, natural eye contact, subtle head movement, no forced smile.',happy:'A relaxed friendly assistant. Small genuine smile, light energy, warm eye contact, natural gestures.',doubtful:'A skeptical but calm assistant. Slightly raised eyebrow, focused eyes, reserved mouth, thoughtful head tilt.',angry:'A strict serious assistant. Firm expression, focused eyes, controlled intensity, no smile, professional restraint.'};
const $=id=>document.getElementById(id);const video=$('avatarVideo'),canvas=$('avatarCanvas'),fallback=$('fallback'),status=$('status'),pill=$('pill'),stage=$('stage'),tapLayer=$('tapLayer'),sheet=$('sheet'),sheetHandle=$('sheetHandle'),log=$('log');
let sdk,pc,dc,lkRoom,lkDest,avatarSessionId,audioCtx,activeSource,responseText='',currentAi=null,currentEmotion='natural',lastEmotion=0,dragY=0,started=false,avatarVideoReady=false,botReady=false,statusTimer=null,avatarStartedAt=0,drawStarted=false,lastFrameAt=0,videoTrackObj=null;
function setStatus(t,m=''){status.textContent=t;pill.classList.toggle('ok',m==='ok');pill.classList.toggle('bad',m==='bad')}
function addLog(kind,text){const el=document.createElement('div');el.className='entry '+kind;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight;return el}
function redact(v){if(!v||typeof v!=='object')return v;if(Array.isArray(v))return v.map(redact);const o={};for(const[k,val]of Object.entries(v)){if(/token|secret|key/i.test(k))o[k]='[redacted]';else o[k]=redact(val)}return o}
function addDebug(label,obj){let safe=redact(obj);let text='';try{text=typeof safe==='string'?safe:JSON.stringify(safe,null,2)}catch(_){text=String(safe)}addLog('debug',label+'\n'+text.slice(0,2200))}
function setFallback(text){fallback.style.display='grid';fallback.textContent=text}
function hideFallback(){fallback.style.display='none'}
function speakUI(on){stage.classList.toggle('speaking',on);document.documentElement.style.setProperty('--pulse',on?'.28':'.12')}
function norm(v){const r=String(v||'natural').toLowerCase();if(r.includes('angry')||r.includes('streng')||r.includes('wut'))return'angry';if(r.includes('doubt')||r.includes('skept')||r.includes('frag'))return'doubtful';if(r.includes('happy')||r.includes('freu')||r.includes('locker'))return'happy';if(r.includes('neutral'))return'neutral';return'natural'}
function detect(t){t=String(t||'').toLowerCase();if(/falsch|unsinn|quatsch|nein|kritisch|problem|fehler|stopp|nicht korrekt/.test(t))return'angry';if(/vielleicht|pruefen|prüfen|unklar|skeptisch|zweifel|nicht sicher|fraglich/.test(t))return'doubtful';if(/gut|laeuft|läuft|passt|super|sauber|perfekt|witz|klappt/.test(t))return'happy';return'natural'}
function getCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioCtx=audioCtx||new C({sampleRate:PCM_RATE});if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}
async function getSdk(){sdk=sdk||await import(LIVEKIT_URL);return sdk}
function forceVideoVisible(){video.style.opacity='1';video.style.display='block';video.style.visibility='visible';video.classList.add('show');canvas.style.opacity='1';canvas.classList.add('show');hideFallback();setStatus('Avatar-Video verbunden','ok')}
function directAttachVideoTrack(track){try{const mst=track.mediaStreamTrack||track._mediaStreamTrack;if(mst){video.srcObject=new MediaStream([mst]);addDebug('Direct video srcObject gesetzt',{readyState:mst.readyState,enabled:mst.enabled,muted:mst.muted,label:mst.label})}}catch(e){addLog('err','Direct video attach Fehler: '+String(e.message||e))}}
function installVideoEvents(){['loadedmetadata','canplay','playing','pause','stalled','waiting','resize','error'].forEach(ev=>video.addEventListener(ev,()=>addDebug('Video event '+ev,{videoWidth:video.videoWidth,videoHeight:video.videoHeight,readyState:video.readyState,paused:video.paused,currentTime:video.currentTime,error:video.error?.message||video.error?.code||null}),{passive:true}));}
function startCanvasMirror(){if(drawStarted)return;drawStarted=true;const ctx=canvas.getContext('2d');const draw=()=>{try{const w=video.videoWidth||0,h=video.videoHeight||0;if(w>0&&h>0&&video.readyState>=2){const r=canvas.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);const cw=Math.max(1,Math.round(r.width*dpr)),ch=Math.max(1,Math.round(r.height*dpr));if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}const scale=Math.max(cw/w,ch/h);const dw=w*scale,dh=h*scale,dx=(cw-dw)/2,dy=(ch-dh)/2;ctx.drawImage(video,dx,dy,dw,dh);lastFrameAt=Date.now();forceVideoVisible();}}catch(e){}requestAnimationFrame(draw)};draw();setTimeout(()=>{if(!lastFrameAt)setFallback('Video-Track ist da, aber Safari rendert noch kein Bild.\nBitte Screenshot vom Verlauf schicken.')},6000)}
async function startAvatar(emotion='natural'){
  try{installVideoEvents();avatarStartedAt=Date.now();setStatus('Lade LemonSlice...');setFallback('Lade Avatar...');const debugRes=await fetch('/avatar/debug').catch(()=>null);if(debugRes) addDebug('Server-Konfig',await debugRes.json().catch(()=>({unreadable:true})));const e=norm(emotion);const res=await fetch('/avatar/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emotion:e,agent_prompt:PROMPTS[e]})});const s=await res.json().catch(()=>({parse_error:true,status:res.status}));addDebug('Avatar-Session Response',s);if(!res.ok||!s.livekit_url||!s.livekit_token)throw new Error(s.error||JSON.stringify(s));avatarSessionId=s.session_id;currentEmotion=e;startStatusPolling();const L=await getSdk();const room=new L.Room({adaptiveStream:true,dynacast:true});
    room.on(L.RoomEvent.ConnectionStateChanged,(state)=>addDebug('LiveKit connection_state',state));
    room.on(L.RoomEvent.Connected,()=>addLog('sys','LiveKit verbunden.'));
    room.on(L.RoomEvent.Disconnected,(reason)=>{addLog('err','LiveKit getrennt: '+String(reason||'unknown'));setStatus('Avatar getrennt','bad')});
    room.on(L.RoomEvent.ParticipantConnected,(p)=>addDebug('Participant connected',{identity:p.identity,metadata:p.metadata}));
    room.on(L.RoomEvent.ParticipantDisconnected,(p)=>addDebug('Participant disconnected',{identity:p.identity}));
    room.on(L.RoomEvent.TrackPublished,(pub,p)=>addDebug('Track published',{participant:p?.identity,kind:pub.kind,source:pub.source,name:pub.trackName,sid:pub.trackSid}));
    room.on(L.RoomEvent.TrackSubscribed,(track,pub,p)=>{addDebug('Track subscribed',{participant:p?.identity,kind:track.kind,source:pub?.source,name:pub?.trackName,sid:pub?.trackSid});attachTrack(track,L)});
    room.on(L.RoomEvent.TrackSubscriptionFailed,(sid,p,err)=>addLog('err','TrackSubscriptionFailed '+String(sid)+' '+String(err?.message||err)));
    room.on(L.RoomEvent.DataReceived,(payload,participant,kind,topic)=>handleLemonData(payload,topic,participant,kind));
    await room.connect(s.livekit_url,s.livekit_token);lkRoom=room;publishAssistantAudio(L);attachExistingTracks(L);setStatus('Verbunden · warte auf Avatar','ok');addLog('sys','LemonSlice-Session erstellt. Warte auf bot_ready/video.');setTimeout(()=>{if(!lastFrameAt)setFallback(avatarVideoReady?'Video-Track da, aber noch kein sichtbares Frame.\nDetails im Verlauf.':'Avatar lädt noch. Verlauf zeigt jetzt Status/Fehler.')},12000)}catch(e){setFallback('LemonSlice nicht verbunden.\n'+String(e.message||e));setStatus('Avatar Fehler','bad');addLog('err','Avatar Fehler: '+String(e.message||e));console.warn(e)}}
function attachTrack(track,L){try{if(track.kind===L.Track.Kind.Video){videoTrackObj=track;try{track.attach(video)}catch(e){addLog('err','LiveKit attach(video) Fehler: '+String(e.message||e))}directAttachVideoTrack(track);video.muted=true;video.autoplay=true;video.playsInline=true;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.play().then(()=>addLog('sys','Video play() ok.')).catch(e=>addLog('err','Video play() blockiert: '+String(e.message||e)));avatarVideoReady=true;forceVideoVisible();startCanvasMirror();addLog('sys','Avatar-Video verbunden.')}if(track.kind===L.Track.Kind.Audio){const el=track.attach();el.autoplay=true;el.playsInline=true;el.play?.().catch(()=>{});addLog('sys','Avatar-Audio-Track verbunden.')}}catch(e){addLog('err','Track-Anbindung Fehler: '+String(e.message||e));console.warn(e)}}
function attachExistingTracks(L){try{for(const p of lkRoom.remoteParticipants.values()){addDebug('Remote participant vorhanden',{identity:p.identity,trackCount:p.trackPublications.size});for(const pub of p.trackPublications.values()){addDebug('Remote publication vorhanden',{identity:p.identity,kind:pub.kind,source:pub.source,name:pub.trackName,sid:pub.trackSid,subscribed:pub.isSubscribed});if(pub.track)attachTrack(pub.track,L)}}}catch(e){addLog('err','ExistingTracks Fehler: '+String(e.message||e))}}
function handleLemonData(payload,topic,participant,kind){try{const text=new TextDecoder().decode(payload);addDebug('DataReceived topic='+(topic||'none')+' from='+(participant?.identity||'unknown'),text);if(topic&&topic!=='lemonslice')return;let msg;try{msg=JSON.parse(text)}catch(e){addLog('err','LemonSlice Data JSON unlesbar: '+text.slice(0,500));return}if(msg.type==='bot_ready'){botReady=true;avatarSessionId=msg.session_id||avatarSessionId;addLog('sys','LemonSlice bot_ready.');setStatus('Avatar bereit','ok')}if(msg.type==='idle_timeout'){addLog('err','LemonSlice idle_timeout.')}if(msg.type==='error'||msg.type==='video_generation_error'){addLog('err','LemonSlice: '+JSON.stringify(msg));setStatus('Avatar Fehler','bad')}if(msg.type==='metric')addDebug('LemonSlice metric',msg)}catch(e){addLog('err','DataReceived Fehler: '+String(e.message||e))}}
function publishAssistantAudio(L){try{const ctx=getCtx();if(!ctx||!lkRoom){addLog('err','Audio-Publish: AudioContext oder Room fehlt.');return}if(lkDest)return;lkDest=ctx.createMediaStreamDestination();const audioTrack=lkDest.stream.getAudioTracks()[0];lkRoom.localParticipant.publishTrack(audioTrack,{name:'assistant-audio',source:L.Track.Source.Microphone}).then((pub)=>addDebug('Audio-Track an LemonSlice gesendet',{sid:pub.trackSid,name:pub.trackName,source:pub.source})).catch(e=>addLog('err','Audio-Publish Fehler: '+String(e.message||e)))}catch(e){addLog('err','Audio-Publish Fehler: '+String(e.message||e))}}
function startStatusPolling(){if(statusTimer)clearInterval(statusTimer);statusTimer=setInterval(async()=>{if(!avatarSessionId||lastFrameAt)return;try{const r=await fetch('/avatar/status/'+encodeURIComponent(avatarSessionId));const data=await r.json().catch(()=>({parse_error:true,status:r.status}));addDebug('LemonSlice Status',data);const s=data?.data?.session_status||data?.session_status;if(s==='ACTIVE')setStatus('LemonSlice ACTIVE · warte Bild','ok');if(s==='FAILED'||s==='TIMED_OUT'){setStatus('Avatar Fehler','bad');setFallback('LemonSlice '+s+'\nDetails im Verlauf.')}}catch(e){addLog('err','Status-Poll Fehler: '+String(e.message||e))}},6000)}
async function setEmotion(emotion){const e=norm(emotion);if(!avatarSessionId||e===currentEmotion||Date.now()-lastEmotion<900)return;currentEmotion=e;lastEmotion=Date.now();setStatus('Mimik: '+e);try{const r=await fetch('/avatar/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:avatarSessionId,emotion:e,agent_prompt:PROMPTS[e]})});const txt=await r.text();if(!r.ok)addLog('err','Mimik-Update Fehler: '+txt);else addDebug('Mimik-Update ok',txt)}catch(err){addLog('err','Mimik-Update Fehler: '+String(err.message||err))}}
function autoEmotion(t){if(t.length<18)return;const e=detect(t);if(e!==currentEmotion)setEmotion(e)}
function appendAi(t){if(!currentAi)currentAi=addLog('ai','');currentAi.textContent+=t;responseText+=t;log.scrollTop=log.scrollHeight;autoEmotion(responseText)}
function stopSpeech(){try{activeSource?.stop()}catch(_){}activeSource=null;speakUI(false)}
function playPcm(pcm){const ctx=getCtx();if(!ctx||!pcm.length)return;const b=ctx.createBuffer(1,pcm.length,PCM_RATE),ch=b.getChannelData(0);for(let i=0;i<pcm.length;i++)ch[i]=Math.max(-1,Math.min(1,pcm[i]/32768));const src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);if(lkDest)src.connect(lkDest);else addLog('err','Kein LemonSlice-Audio-Ziel vorhanden. Avatar bekommt keinen Ton.');activeSource=src;speakUI(true);src.onended=()=>{if(activeSource===src)activeSource=null;speakUI(false);setStatus('Bereit','ok')};src.start()}
async function speakText(text){text=String(text||'').replace(/\s+/g,' ').trim();if(!text)return;stopSpeech();await setEmotion(detect(text));setStatus('Spricht · eigene Stimme','ok');try{const r=await fetch('/tts/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw new Error(await r.text());const ab=await r.arrayBuffer();addDebug('TTS Audio',{bytes:ab.byteLength,sampleRate:PCM_RATE});playPcm(new Int16Array(ab))}catch(e){addLog('err','Stimme Fehler: '+String(e.message||e));setStatus('Stimme Fehler','bad')}}
function extractDone(msg){try{for(const item of msg.response.output||[])for(const p of item.content||[])if(p.text||p.transcript)return p.text||p.transcript}catch(_){}return''}
async function connect(){if(started||dc?.readyState==='open')return;started=true;tapLayer.classList.remove('show');setStatus('Verbinde Stimme...');try{getCtx();const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});pc=new RTCPeerConnection();stream.getTracks().forEach(t=>pc.addTrack(t,stream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{setStatus('Bereit','ok');addLog('sys','Voice-Agent verbunden.');const gs=['Begruesse Simon kurz: Moin Simon. Gesicht online, Wuerde im Beta-Status.','Begruesse Simon kurz: Hi Simon. Avatar laeuft. Jetzt fehlt nur noch ein guter Grund.','Begruesse Simon kurz: Simon, da bist du ja. Ich schaue neutral, wie ein sehr teurer Toaster.'];dc.send(JSON.stringify({type:'response.create',response:{instructions:gs[Math.floor(Math.random()*gs.length)]}}))};dc.onmessage=e=>handleRealtime(e.data);dc.onerror=()=>setStatus('DataChannel-Fehler','bad');pc.onconnectionstatechange=()=>{addDebug('OpenAI RTC state',pc.connectionState);if(pc.connectionState==='connected')setStatus('Bereit','ok');if(['failed','disconnected'].includes(pc.connectionState))setStatus('Verbindung weg','bad')};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/rtc-answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:offer.sdp,instructions:DEFAULT_INSTRUCTIONS})});const answer=await r.text();if(!r.ok)throw new Error(answer);await pc.setRemoteDescription({type:'answer',sdp:answer})}catch(e){started=false;tapLayer.classList.add('show');setStatus('Antippen zum Starten','bad');addLog('err','Start blockiert/fehlgeschlagen: '+String(e.message||e));console.warn(e)}}
function handleRealtime(raw){let msg;try{msg=JSON.parse(raw)}catch{return}const type=msg.type||'';if(type==='response.created'){responseText='';currentAi=null;speakUI(true)}if(type==='input_audio_buffer.speech_started'||type==='conversation.interrupted')stopSpeech();if((type==='response.output_text.delta'||type==='response.text.delta'||type==='response.audio_transcript.delta')&&msg.delta)appendAi(msg.delta);if(type==='response.done'){if(!responseText)responseText=extractDone(msg);currentAi=null;speakText(responseText)}if(type==='conversation.item.input_audio_transcription.completed'&&msg.transcript){addLog('me',msg.transcript);setEmotion(detect(msg.transcript))}if(type==='error')addLog('err',msg.error?.message||JSON.stringify(msg))}
function openSheet(open){sheet.classList.toggle('open',open)}sheetHandle.addEventListener('click',()=>openSheet(!sheet.classList.contains('open')));document.body.addEventListener('touchstart',e=>{dragY=e.touches[0].clientY},{passive:true});document.body.addEventListener('touchend',e=>{const d=dragY-e.changedTouches[0].clientY;if(d>55)openSheet(true);if(d<-45)openSheet(false)},{passive:true});tapLayer.addEventListener('click',connect);tapLayer.addEventListener('touchend',e=>{e.preventDefault();connect()},{passive:false});
addLog('sys','App gestartet. Auto-Connect läuft.');startAvatar();setTimeout(connect,700);
</script>
</body>
</html>
