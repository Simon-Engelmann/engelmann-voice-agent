<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Engelmann Voice Agent</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg: #fbfbfd;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0,0,0,.08);
      --blue: #007aff;
      --green: #34c759;
      --red: #ff3b30;
      --glass: rgba(255,255,255,.78);
      --mouth-scale: .35;
      --voice-lift: 0px;
      --voice-glow: .12;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 38%, rgba(219,236,255,.96) 0, #ffffff 42%, var(--bg) 100%);
      color: var(--text);
    }

    .app {
      position: relative;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .aurora {
      position: absolute;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(circle at 25% 30%, rgba(0,122,255,.10), transparent 28%),
        radial-gradient(circle at 72% 38%, rgba(52,199,89,.10), transparent 30%),
        radial-gradient(circle at 50% 75%, rgba(90,200,250,.12), transparent 26%);
      filter: blur(18px);
      animation: aurora 12s ease-in-out infinite alternate;
    }

    @keyframes aurora {
      from {
        transform: translate3d(-1%, -1%, 0) scale(1);
      }

      to {
        transform: translate3d(1.5%, 1%, 0) scale(1.04);
      }
    }

    .top {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 24px);
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 10px 28px rgba(0,0,0,.06);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: #c7c7cc;
      flex: 0 0 auto;
    }

    .ok .dot {
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(52,199,89,.12);
    }

    .bad .dot {
      background: var(--red);
      box-shadow: 0 0 0 6px rgba(255,59,48,.12);
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(88vw, 480px);
      height: min(88vw, 480px);
      isolation: isolate;
      transform: translateY(var(--voice-lift));
      transition: transform .18s ease;
    }

    .stage::before {
      content: "";
      position: absolute;
      width: 74%;
      height: 74%;
      border-radius: 50%;
      background: radial-gradient(circle at 42% 32%, rgba(255,255,255,.88), rgba(255,255,255,.42) 46%, rgba(0,122,255,.06) 72%, transparent 100%);
      box-shadow:
        0 32px 90px rgba(0,72,180,calc(.10 + var(--voice-glow))),
        inset 0 1px 0 rgba(255,255,255,.88);
      z-index: -1;
      animation: halo 5.8s ease-in-out infinite;
    }

    @keyframes halo {
      0%,100% {
        transform: scale(1);
        opacity: .92;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    #threeWrap {
      width: min(88vw, 480px);
      height: min(88vw, 480px);
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .fallbackFace {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      font-size: 92px;
      filter: drop-shadow(0 20px 35px rgba(0,0,0,.18));
      animation: fallbackFloat 4s ease-in-out infinite;
    }

    .fallbackFace.show {
      display: grid;
    }

    @keyframes fallbackFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .hint {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: #b0b0b7;
      font-size: 12px;
      text-align: center;
      z-index: 5;
    }

    .hint::before {
      content: "";
      display: block;
      width: 42px;
      height: 5px;
      background: #d1d1d6;
      border-radius: 4px;
      margin: 0 auto 8px;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(74dvh, 700px);
      z-index: 20;
      transform: translateY(calc(100% - 56px));
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
      border-radius: 30px 30px 0 0;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--line);
      box-shadow: 0 -28px 70px rgba(0,0,0,.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sheet.open {
      transform: translateY(0);
    }

    @media (min-width: 760px) {
      .sheet {
        left: 50%;
        right: auto;
        width: 720px;
        transform: translate(-50%, calc(100% - 56px));
      }

      .sheet.open {
        transform: translate(-50%, 0);
      }
    }

    .handle-wrap {
      padding: 10px 18px 8px;
      text-align: center;
    }

    .handle {
      width: 48px;
      height: 5px;
      border-radius: 6px;
      background: #d1d1d6;
      margin: 0 auto 8px;
    }

    .chat-title {
      font-weight: 700;
      font-size: 15px;
    }

    .log {
      flex: 1;
      overflow: auto;
      padding: 10px 14px max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .bubble {
      max-width: 88%;
      padding: 11px 13px;
      border-radius: 18px;
      line-height: 1.35;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .me {
      align-self: flex-end;
      background: var(--blue);
      color: white;
      border-bottom-right-radius: 6px;
    }

    .ai {
      align-self: flex-start;
      background: #f1f1f4;
      color: var(--text);
      border-bottom-left-radius: 6px;
    }

    .system {
      align-self: center;
      max-width: 94%;
      background: #fff8dc;
      color: #6b5b00;
      font-size: 13px;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 22px;
      z-index: 60;
      background: rgba(251,251,253,.66);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal.show {
      display: grid;
    }

    .card {
      width: min(430px, 100%);
      padding: 26px;
      border-radius: 28px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 24px 70px rgba(0,0,0,.14);
      border: 1px solid var(--line);
      text-align: center;
    }

    .card h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: -.02em;
    }

    .card p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.38;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      padding: 12px 14px;
      font: inherit;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      margin-top: 12px;
      padding: 10px;
      border-radius: 14px;
      background: #fff1f0;
      color: #9f1c15;
      font-size: 13px;
      text-align: left;
      white-space: pre-wrap;
      display: none;
    }

    .error.show {
      display: block;
    }
  </style>
</head>

<body>
  <div id="root" class="app">
    <div class="aurora"></div>

    <div class="top">
      <div id="statusPill" class="pill">
        <span class="dot"></span>
        <span id="statusText">Lade App...</span>
      </div>
    </div>

    <div class="stage">
      <div id="threeWrap">
        <div id="fallbackFace" class="fallbackFace">👩‍⚕️</div>
      </div>
    </div>

    <div class="hint">Nach oben wischen für Verlauf</div>
  </div>

  <section id="chatSheet" class="sheet">
    <div id="chatHandle" class="handle-wrap">
      <div class="handle"></div>
      <div class="chat-title">Verlauf</div>
    </div>
    <div id="chatLog" class="log"></div>
  </section>

  <div id="startModal" class="modal">
    <div class="card">
      <h1>Zum Starten tippen</h1>
      <p>Der Browser braucht einmal deine Freigabe für Mikrofon und Audio.</p>
      <button id="startBtn" type="button">Einmal tippen</button>
      <div id="startError" class="error"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const DEFAULT_INSTRUCTIONS =
      'Du bist Simons deutscher Voice-Agent. Sprich kurz, klar, nüchtern und trocken-humorig. Sprich mit deutscher Aussprache und deutscher Satzmelodie. Keine englischen Füllwörter. Keine KI-Floskeln. Maximal 1 bis 3 Sätze.';

    const $ = (id) => document.getElementById(id);

    const root = $('root');
    const statusPill = $('statusPill');
    const statusText = $('statusText');
    const chatSheet = $('chatSheet');
    const chatHandle = $('chatHandle');
    const chatLog = $('chatLog');
    const startModal = $('startModal');
    const startBtn = $('startBtn');
    const startError = $('startError');
    const threeWrap = $('threeWrap');
    const fallbackFace = $('fallbackFace');

    let pc = null;
    let dc = null;
    let remoteAudio = null;
    let dragStartY = 0;
    let currentAiBubble = null;
    let stopSpeakingTimer = null;
    let connecting = false;

    let audioContext = null;
    let analyser = null;
    let analyserRunning = false;

    let scene;
    let camera;
    let renderer;
    let clock;
    let mixer;
    let avatarRoot;
    let loadedAvatar = null;
    let morphTargets = [];
    let bones = {};
    let speakingEnergy = 0;

    initThree();
    loadAvatar();
    loadConfig();

    setTimeout(() => {
      connect().catch(() => {
        startModal.classList.add('show');
      });
    }, 600);

    function setStatus(text, mode = '') {
      statusText.textContent = text;
      statusPill.classList.toggle('ok', mode === 'ok');
      statusPill.classList.toggle('bad', mode === 'bad');
    }

    function showError(text) {
      startError.textContent = text || '';
      startError.classList.toggle('show', Boolean(text));
    }

    function openChat(open) {
      chatSheet.classList.toggle('open', open);
    }

    function bubble(role, text) {
      const el = document.createElement('div');
      el.className = `bubble ${role}`;
      el.textContent = text;
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
      return el;
    }

    function aiDelta(text) {
      if (!currentAiBubble) currentAiBubble = bubble('ai', '');
      currentAiBubble.textContent += text;
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function speak() {
      clearTimeout(stopSpeakingTimer);
      root.classList.add('speaking');
    }

    function stopSoon() {
      clearTimeout(stopSpeakingTimer);
      stopSpeakingTimer = setTimeout(() => {
        root.classList.remove('speaking');
        speakingEnergy = 0;
        document.documentElement.style.setProperty('--voice-lift', '0px');
        document.documentElement.style.setProperty('--voice-glow', '.12');
      }, 1400);
    }

    async function loadConfig() {
      try {
        const res = await fetch('/app-config.json?v=' + Date.now());
        if (!res.ok) return;

        const config = await res.json();
        document.body.classList.toggle('dark', config.theme === 'dark');
      } catch (_) {}
    }

    function initThree() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
      camera.position.set(0, 1.3, 5.2);

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(threeWrap.clientWidth, threeWrap.clientHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      threeWrap.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      avatarRoot = new THREE.Group();
      scene.add(avatarRoot);

      const hemi = new THREE.HemisphereLight(0xffffff, 0xbfd4ff, 2.5);
      scene.add(hemi);

      const key = new THREE.DirectionalLight(0xffffff, 2.4);
      key.position.set(2.6, 4.2, 4.5);
      scene.add(key);

      const fill = new THREE.DirectionalLight(0xffffff, 1.1);
      fill.position.set(-3, 2.5, 2);
      scene.add(fill);

      window.addEventListener('resize', resizeThree);
      resizeThree();
      animateThree();
    }

    function resizeThree() {
      const width = threeWrap.clientWidth || 400;
      const height = threeWrap.clientHeight || 400;

      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    async function loadAvatar() {
      setStatus('Lade Avatar...');

      const timer = setTimeout(() => {
        if (!loadedAvatar) {
          showFallbackAvatar('Avatar lädt zu lange');
        }
      }, 7000);

      try {
        const head = await fetch('/avatar/model.glb?v=' + Date.now(), {
          method: 'HEAD'
        });

        if (!head.ok) {
          throw new Error('public/avatar/model.glb fehlt noch.');
        }

        const loader = new GLTFLoader();

        const gltf = await new Promise((resolve, reject) => {
          loader.load(
            '/avatar/model.glb?v=' + Date.now(),
            resolve,
            undefined,
            reject
          );
        });

        clearTimeout(timer);
        useAvatar(gltf);
        setStatus('Avatar geladen');
        setTimeout(() => setStatus('Verbinde...'), 700);
      } catch (error) {
        clearTimeout(timer);
        showFallbackAvatar(error.message || String(error));
      }
    }

    function showFallbackAvatar(reason) {
      console.warn('Avatar fallback:', reason);
      fallbackFace.classList.add('show');
      setStatus('Avatar-Fallback');
      setTimeout(() => setStatus('Verbinde...'), 900);
    }

    function useAvatar(gltf) {
      loadedAvatar = gltf.scene;
      fallbackFace.classList.remove('show');

      avatarRoot.clear();
      avatarRoot.add(gltf.scene);

      gltf.scene.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;

          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(prepareMaterial);
            } else {
              prepareMaterial(child.material);
            }
          }

          if (child.morphTargetDictionary && child.morphTargetInfluences) {
            for (const [name, index] of Object.entries(child.morphTargetDictionary)) {
              if (/jaw|mouth|open|aa|oh|viseme|vrc|a_|e_|i_|o_|u_/i.test(name)) {
                morphTargets.push({
                  mesh: child,
                  index,
                  name
                });
              }
            }
          }
        }

        if (child.isBone) {
          const name = child.name.toLowerCase();

          if (!bones.head && name.includes('head')) bones.head = child;
          if (!bones.neck && name.includes('neck')) bones.neck = child;
          if (!bones.spine && (name.includes('spine') || name.includes('chest'))) bones.spine = child;
          if (!bones.jaw && (name.includes('jaw') || name.includes('mouth'))) bones.jaw = child;
          if (!bones.leftArm && (name.includes('leftarm') || name.includes('upperarm_l') || name.includes('arm_l'))) bones.leftArm = child;
          if (!bones.rightArm && (name.includes('rightarm') || name.includes('upperarm_r') || name.includes('arm_r'))) bones.rightArm = child;
        }
      });

      fitAvatar(gltf.scene);

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(gltf.scene);
        mixer.clipAction(gltf.animations[0]).play();
      }
    }

    function prepareMaterial(material) {
      material.side = THREE.DoubleSide;

      if ('roughness' in material) material.roughness = 0.58;
      if ('metalness' in material) material.metalness = 0.05;

      material.needsUpdate = true;
    }

    function fitAvatar(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      const maxDimension = Math.max(size.x, size.y, size.z) || 1;
      const scale = 2.7 / maxDimension;

      object.scale.setScalar(scale);

      const scaledBox = new THREE.Box3().setFromObject(object);
      const scaledCenter = new THREE.Vector3();

      scaledBox.getCenter(scaledCenter);

      object.position.x -= scaledCenter.x;
      object.position.z -= scaledCenter.z;
      object.position.y -= scaledBox.min.y;
      object.position.y -= 1.35;
    }

    function animateThree() {
      requestAnimationFrame(animateThree);

      const delta = clock.getDelta();
      const time = clock.elapsedTime;

      if (mixer) mixer.update(delta);

      const idle = Math.sin(time * 1.35) * 0.035;
      const talk = speakingEnergy;

      avatarRoot.position.y = idle + talk * 0.06;
      avatarRoot.rotation.y = Math.sin(time * 0.65) * 0.045 + talk * 0.045;
      avatarRoot.rotation.x = Math.sin(time * 0.55) * 0.015;

      if (bones.head) {
        bones.head.rotation.y = Math.sin(time * 0.8) * 0.08 + talk * 0.08;
        bones.head.rotation.x = Math.sin(time * 0.7) * 0.035 - talk * 0.05;
      }

      if (bones.neck) {
        bones.neck.rotation.y = Math.sin(time * 0.6) * 0.04;
      }

      if (bones.spine) {
        bones.spine.rotation.z = Math.sin(time * 0.55) * 0.025;
      }

      if (bones.jaw) {
        bones.jaw.rotation.x = talk * 0.32;
      }

      if (bones.leftArm) {
        bones.leftArm.rotation.z = Math.sin(time * 1.2) * 0.04 + talk * 0.12;
      }

      if (bones.rightArm) {
        bones.rightArm.rotation.z = Math.sin(time * 1.1) * -0.04 - talk * 0.12;
      }

      for (const target of morphTargets) {
        target.mesh.morphTargetInfluences[target.index] = Math.min(1, talk * 1.15);
      }

      renderer.render(scene, camera);
    }

    function startAudioAnalyser(stream) {
      if (analyserRunning) return;

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        audioContext = audioContext || new AudioContextClass();

        if (audioContext.state === 'suspended') {
          audioContext.resume().catch(() => {});
        }

        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.78;
        source.connect(analyser);

        const data = new Uint8Array(analyser.fftSize);
        analyserRunning = true;

        function loop() {
          if (!analyserRunning || !analyser) return;

          analyser.getByteTimeDomainData(data);

          let sum = 0;

          for (let i = 0; i < data.length; i++) {
            const value = (data[i] - 128) / 128;
            sum += value * value;
          }

          const rms = Math.sqrt(sum / data.length);
          const energy = Math.min(1, Math.max(0, (rms - 0.012) * 7));

          speakingEnergy = energy;

          const lift = -energy * 7;
          const glow = 0.12 + energy * 0.22;

          document.documentElement.style.setProperty('--voice-lift', `${lift.toFixed(1)}px`);
          document.documentElement.style.setProperty('--voice-glow', glow.toFixed(2));

          if (energy > 0.07) {
            root.classList.add('speaking');
          }

          requestAnimationFrame(loop);
        }

        loop();
      } catch (_) {}
    }

    async function fetchWithTimeout(url, options = {}, ms = 25000) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), ms);

      try {
        return await fetch(url, {
          ...options,
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeout);
      }
    }

    async function connect() {
      if (connecting || dc?.readyState === 'open') return;

      connecting = true;
      showError('');
      startModal.classList.remove('show');
      setStatus('Verbinde...');

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error('Mikrofon wird in diesem Browser nicht unterstützt.');
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        setStatus('Token...');

        const tokenResp = await fetchWithTimeout('/session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            instructions: DEFAULT_INSTRUCTIONS,
            voice: 'coral'
          })
        }, 20000);

        const tokenText = await tokenResp.text();
        let tokenData = {};

        try {
          tokenData = JSON.parse(tokenText);
        } catch (_) {}

        const key = tokenData?.value || tokenData?.client_secret?.value;

        if (!tokenResp.ok || !key) {
          throw new Error('/session Fehler ' + tokenResp.status + ': ' + tokenText);
        }

        setStatus('Audio...');

        remoteAudio = remoteAudio || document.createElement('audio');
        remoteAudio.autoplay = true;
        remoteAudio.playsInline = true;
        remoteAudio.setAttribute('playsinline', '');
        document.body.appendChild(remoteAudio);

        pc = new RTCPeerConnection();

        pc.ontrack = (event) => {
          const remoteStream = event.streams[0];
          remoteAudio.srcObject = remoteStream;
          remoteAudio.play().catch(() => {});
          startAudioAnalyser(remoteStream);
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'connected') {
            setStatus('Sprich jetzt', 'ok');
          }

          if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
            setStatus('Verbindung weg', 'bad');
          }
        };

        stream.getTracks().forEach((track) => pc.addTrack(track, stream));

        dc = pc.createDataChannel('oai-events');

        dc.onopen = () => {
          setStatus('Sprich jetzt', 'ok');
          bubble('system', 'Bereit.');

          const greetings = [
            'Begrüße Simon kurz: Moin Simon. Ich bin wach. Mehr kann man technisch kaum verlangen.',
            'Begrüße Simon kurz: Hi Simon. System läuft, Laune stabil, Rest verhandeln wir.',
            'Begrüße Simon kurz: Simon, da bist du ja. Ich habe schon mal so getan, als wäre ich produktiv.',
            'Begrüße Simon kurz: Moin Simon. Lass uns was Sinnvolles tun. Rein statistisch muss es ja irgendwann klappen.',
            'Begrüße Simon kurz: Hi Simon. Bereit. Ich habe sogar so getan, als hätte ich Kaffee bekommen.'
          ];

          const greeting = greetings[Math.floor(Math.random() * greetings.length)];

          setTimeout(() => {
            try {
              dc.send(JSON.stringify({
                type: 'response.create',
                response: {
                  instructions: greeting
                }
              }));
            } catch (_) {}
          }, 500);
        };

        dc.onerror = () => setStatus('DataChannel-Fehler', 'bad');
        dc.onmessage = (event) => handleRealtime(event.data);

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const api = ['https://api.openai.com/v1', 'realtime', 'calls'].join('/');
        const headers = {
          Authorization: 'Bearer ' + key,
          'Content-Type': 'application/sdp'
        };

        const sdpResp = await fetchWithTimeout(api, {
          method: 'POST',
          body: offer.sdp,
          headers
        }, 30000);

        const answer = await sdpResp.text();

        if (!sdpResp.ok) {
          throw new Error('SDP Fehler ' + sdpResp.status + ': ' + answer);
        }

        await pc.setRemoteDescription({
          type: 'answer',
          sdp: answer
        });

        connecting = false;
      } catch (error) {
        fail(
          error?.name === 'NotAllowedError'
            ? 'Bitte Mikrofon erlauben und erneut tippen.'
            : error?.name === 'AbortError'
              ? 'Verbindung hat zu lange gedauert.'
              : String(error.message || error)
        );
      }
    }

    function disconnect(show = true) {
      try {
        if (dc) dc.close();
        if (pc) pc.close();
      } catch (_) {}

      dc = null;
      pc = null;
      analyserRunning = false;
      analyser = null;

      root.classList.remove('speaking');

      if (show) startModal.classList.add('show');
    }

    function fail(message) {
      setStatus('Start fehlgeschlagen', 'bad');
      showError(message);
      startModal.classList.add('show');
      connecting = false;
      disconnect(false);
    }

    function showError(text) {
      startError.textContent = text || '';
      startError.classList.toggle('show', Boolean(text));
    }

    function handleRealtime(raw) {
      let msg;

      try {
        msg = JSON.parse(raw);
      } catch (_) {
        return;
      }

      const type = msg.type || '';

      if (type === 'response.created' || type === 'response.audio.delta') {
        speak();
      }

      if (type === 'response.audio.done') {
        stopSoon();
      }

      if (type === 'response.audio_transcript.delta' && msg.delta) {
        aiDelta(msg.delta);
      }

      if (type === 'response.output_text.delta' && msg.delta) {
        aiDelta(msg.delta);
      }

      if (
        type === 'response.audio_transcript.done' ||
        type === 'response.output_text.done' ||
        type === 'response.done'
      ) {
        currentAiBubble = null;
        stopSoon();
      }

      if (
        type === 'conversation.item.input_audio_transcription.completed' &&
        msg.transcript
      ) {
        bubble('me', msg.transcript);
      }

      if (type === 'error') {
        bubble('system', msg.error?.message || JSON.stringify(msg));
      }
    }

    function startTap(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      connect();
    }

    startBtn.addEventListener('click', startTap);
    startBtn.addEventListener('touchend', startTap, { passive: false });
    startBtn.addEventListener('pointerup', startTap);

    chatHandle.addEventListener('click', () => {
      openChat(!chatSheet.classList.contains('open'));
    });

    chatSheet.addEventListener('touchstart', (event) => {
      dragStartY = event.touches[0].clientY;
    }, { passive: true });

    chatSheet.addEventListener('touchend', (event) => {
      const delta = dragStartY - event.changedTouches[0].clientY;

      if (delta > 30) openChat(true);
      if (delta < -30) openChat(false);
    }, { passive: true });

    document.body.addEventListener('touchstart', (event) => {
      dragStartY = event.touches[0].clientY;
    }, { passive: true });

    document.body.addEventListener('touchend', (event) => {
      const delta = dragStartY - event.changedTouches[0].clientY;

      if (delta > 55) openChat(true);
    }, { passive: true });
  </script>
</body>
</html>
