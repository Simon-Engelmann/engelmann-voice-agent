<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0A84FF" />
<meta name="description" content="Dein persönlicher KI-Voice-Agent mit sichtbarem Avatar." />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Engelmann" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
<title>Engelmann Voice Agent</title>
<style>
:root{--bg:#fbfbfd;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--glass:rgba(255,255,255,.82);--ok:#34c759;--bad:#ff3b30;--avatar-zoom:1.34;--avatar-shift:7%}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% 36%,rgba(222,238,255,.98),#fff 48%,var(--bg) 100%)}.app{position:relative;min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:hidden}.aurora{position:absolute;inset:-20%;background:radial-gradient(circle at 24% 34%,rgba(0,122,255,.10),transparent 26%),radial-gradient(circle at 76% 38%,rgba(52,199,89,.10),transparent 30%),radial-gradient(circle at 50% 76%,rgba(90,200,250,.13),transparent 28%);filter:blur(18px);pointer-events:none}.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;max-width:calc(100vw - 24px)}.pill{display:flex;align-items:center;gap:8px;min-height:34px;padding:7px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 10px 28px rgba(0,0,0,.06);font-size:13px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:99px;background:#c7c7cc;flex:0 0 auto}.pill.ok .dot{background:var(--ok);box-shadow:0 0 0 6px rgba(52,199,89,.12)}.pill.bad .dot{background:var(--bad);box-shadow:0 0 0 6px rgba(255,59,48,.12)}.stage{position:relative;width:min(86vw,520px);height:min(86vw,520px);display:grid;place-items:center;isolation:isolate}.stage.speaking #avatarFrame{box-shadow:0 18px 60px rgba(0,72,180,.10),inset 0 0 0 1px rgba(255,255,255,.95),0 0 56px 6px rgba(0,122,255,.30)}.stage:before{content:"";position:absolute;width:80%;height:80%;border-radius:50%;background:#fff;box-shadow:0 32px 90px rgba(0,72,180,.14),0 0 0 1px rgba(255,255,255,.9),inset 0 1px 0 rgba(255,255,255,.9);z-index:-1}#avatarFrame{position:relative;width:80%;height:80%;border-radius:50%;overflow:hidden;transform:translateZ(0);background:linear-gradient(180deg,#eef3fb,#e4ebf5);border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 60px rgba(0,72,180,.08),inset 0 0 0 1px rgba(255,255,255,.95);transition:box-shadow .45s ease}#avatarFrame:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9);pointer-events:none;z-index:6}#avatarVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transform:scale(var(--avatar-zoom)) translateY(var(--avatar-shift));transform-origin:center 24%;background:transparent;opacity:0;transition:opacity .45s ease;z-index:3}#avatarVideo.show{opacity:1}.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:30px;color:var(--muted);font-size:14px;text-align:center;white-space:pre-wrap;line-height:1.35;z-index:4}.hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;color:#b0b0b7;font-size:12px;text-align:center;user-select:none}.hint:before{content:"";display:block;width:42px;height:5px;background:#d1d1d6;border-radius:4px;margin:0 auto 8px}.sheet{position:fixed;left:0;right:0;bottom:0;height:min(74dvh,700px);z-index:30;transform:translateY(calc(100% - 56px));transition:transform .28s cubic-bezier(.2,.8,.2,1);border-radius:30px 30px 0 0;background:rgba(255,255,255,.96);border:1px solid var(--line);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 -28px 70px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden}.sheet.open{transform:translateY(0)}@media(min-width:760px){.sheet{left:50%;right:auto;width:720px;transform:translate(-50%,calc(100% - 56px))}.sheet.open{transform:translate(-50%,0)}}.handle-wrap{padding:10px 18px 8px;text-align:center;user-select:none}.handle{width:48px;height:5px;border-radius:6px;background:#d1d1d6;margin:0 auto 8px}.chat-title{font-weight:700;font-size:15px}.log{flex:1;overflow:auto;padding:10px 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}.entry{max-width:94%;padding:10px 12px;border-radius:16px;line-height:1.35;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.sys{align-self:center;background:#fff8dc;color:#6b5b00;font-size:13px}.err{align-self:center;background:#fff1f0;color:#9f1c15;font-size:13px}.debug{align-self:center;background:#eef6ff;color:#20466b;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.tapLayer{position:fixed;inset:0;z-index:5;background:transparent}.audioSink{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:.01;pointer-events:none}.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:0;transition:opacity .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}.loader.show{opacity:1}.loader .orb{position:absolute;width:54%;height:54%;border-radius:50%;background:conic-gradient(from 0deg,#0a84ff,#5ac8fa,#34c759,#5ac8fa,#0a84ff);filter:blur(8px);opacity:.85;animation:lk-spin 3.4s linear infinite}.loader .core{position:absolute;width:30%;height:30%;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff,rgba(255,255,255,.6));box-shadow:0 0 46px rgba(10,132,255,.55);animation:lk-breathe 2.6s ease-in-out infinite}.loader .ring{position:absolute;width:42%;height:42%;border-radius:50%;border:2px solid rgba(10,132,255,.30);animation:lk-ripple 2.6s ease-out infinite}.loader .ring:nth-child(2){animation-delay:.85s}.loader .ring:nth-child(3){animation-delay:1.7s}@keyframes lk-spin{to{transform:rotate(360deg)}}@keyframes lk-breathe{0%,100%{transform:scale(.9);opacity:.85}50%{transform:scale(1.1);opacity:1}}@keyframes lk-ripple{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.9);opacity:0}}@media(prefers-reduced-motion:reduce){.loader .orb,.loader .core,.loader .ring{animation:none}}
</style>
</head>
<body>
<div id="root" class="app"><div class="aurora"></div><div class="top"><div id="pill" class="pill"><span class="dot"></span><span id="status">Antippen zum Starten</span></div></div><div id="stage" class="stage"><div id="avatarFrame"><div id="loader" class="loader" aria-hidden="true"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="orb"></span><span class="core"></span></div><video id="avatarVideo" autoplay playsinline muted></video><div id="fallback" class="fallback">Antippen, Mikrofon erlauben.</div></div></div><div class="hint">Nach oben wischen für Verlauf</div><div id="tapLayer" class="tapLayer"></div><div id="audioSink" class="audioSink"></div></div>
<section id="sheet" class="sheet"><div id="sheetHandle" class="handle-wrap"><div class="handle"></div><div class="chat-title">Verlauf</div></div><div id="log" class="log"></div></section>
<script type="module">
const LIVEKIT_CLIENT_URL='https://esm.sh/livekit-client@2.15.13';
const $=id=>document.getElementById(id);
const video=$('avatarVideo'),fallback=$('fallback'),status=$('status'),pill=$('pill'),stage=$('stage'),tapLayer=$('tapLayer'),sheet=$('sheet'),sheetHandle=$('sheetHandle'),log=$('log'),audioSink=$('audioSink'),loader=$('loader');
let sdk,room,started=false,attachedVideo=null,dragY=0,lastFrameAt=0,scanTimer=null;
const seen=new Set(),attachedAudioTracks=new Set();
function redact(value){if(!value||typeof value!=='object'){if(typeof value==='string')return value.replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g,'[jwt-redacted]').slice(0,3000);return value}if(Array.isArray(value))return value.map(redact);const out={};for(const[k,child]of Object.entries(value))out[k]=/token|secret|key|authorization|jwt/i.test(k)?'[redacted]':redact(child);return out}
function sendDebug(level,message,data=null){fetch('/debug-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'browser',level,message,data:redact(data),path:location.pathname})}).catch(()=>{})}
function setStatus(text,mode=''){status.textContent=text;pill.classList.toggle('ok',mode==='ok');pill.classList.toggle('bad',mode==='bad')}
function addLog(kind,text){const el=document.createElement('div');el.className=`entry ${kind}`;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight;if(kind==='err')sendDebug('error',text);return el}
function addDebug(label,obj){let text='';try{text=typeof obj==='string'?obj:JSON.stringify(redact(obj),null,2)}catch{text=String(obj)}addLog('debug',`${label}\n${text.slice(0,2200)}`);sendDebug('info',label,obj)}
function debugOnce(key,label,obj){if(seen.has(key))return;seen.add(key);addDebug(label,obj)}
function safeError(error){return{name:error?.name||null,message:String(error?.message||error),stack:error?.stack?String(error.stack).split('\n').slice(0,5).join('\n'):null}}
window.addEventListener('error',event=>sendDebug('error','window error',{message:event.message,source:event.filename,line:event.lineno,column:event.colno,error:safeError(event.error)}));
window.addEventListener('unhandledrejection',event=>sendDebug('error','unhandled rejection',safeError(event.reason)));
function showFallback(text){fallback.style.display='grid';fallback.textContent=text;sendDebug('warn','fallback shown',{text})}
function hideFallback(){fallback.style.display='none'}
function speakUI(on){stage.classList.toggle('speaking',on)}
async function getSdk(){sdk=sdk||await import(LIVEKIT_CLIENT_URL);return sdk}
function publicationInfo(publication,participant){return{participant:participant?.identity,kind:publication.kind,source:publication.source,name:publication.trackName,sid:publication.trackSid,subscribed:publication.isSubscribed,muted:publication.isMuted,enabled:publication.isEnabled,hasTrack:Boolean(publication.track)}}
function markVideoVisible(){video.classList.add('show');hideFallback();loader.classList.remove('show');setStatus('Avatar verbunden','ok')}
function attachVideoTrack(track,LiveKit,publication,participant){if(!track||attachedVideo===track)return;attachedVideo=track;try{track.attach(video)}catch(error){addLog('err',`Video attach Fehler: ${String(error.message||error)}`);sendDebug('error','video attach failed',safeError(error))}video.autoplay=true;video.playsInline=true;video.muted=true;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.play().catch(error=>sendDebug('warn','video play deferred',safeError(error)));markVideoVisible();addLog('sys',`Avatar-Video verbunden: ${participant?.identity||'remote'}`);debugOnce(`video-${publication?.trackSid||track.sid}`,'Video-Track',publicationInfo(publication,participant))}
function attachAudioTrack(track,LiveKit,publication,participant){const key=publication?.trackSid||track?.sid||`${participant?.identity}-${publication?.trackName}`;if(!track||attachedAudioTracks.has(key))return;attachedAudioTracks.add(key);try{const el=track.attach();el.autoplay=true;el.playsInline=true;el.controls=false;el.muted=false;el.volume=1;audioSink.appendChild(el);const play=async()=>{try{await room?.startAudio?.();await el.play?.();sendDebug('info','audio play started',publicationInfo(publication,participant))}catch(error){sendDebug('warn','audio play deferred',safeError(error))}};play();debugOnce(`audio-${key}`,'Audio-Track',publicationInfo(publication,participant));speakUI(true);setTimeout(()=>speakUI(false),1200)}catch(error){addLog('err',`Audio attach Fehler: ${String(error.message||error)}`);sendDebug('error','audio attach failed',safeError(error))}}
function attachTrack(track,LiveKit,publication,participant){if(track.kind===LiveKit.Track.Kind.Video||publication?.kind===LiveKit.Track.Kind.Video)attachVideoTrack(track,LiveKit,publication,participant);if(track.kind===LiveKit.Track.Kind.Audio||publication?.kind===LiveKit.Track.Kind.Audio)attachAudioTrack(track,LiveKit,publication,participant)}
function scanRemoteTracks(LiveKit){if(!room)return;try{for(const participant of room.remoteParticipants.values()){for(const publication of participant.trackPublications.values()){const info=publicationInfo(publication,participant);debugOnce(`pub-${publication.trackSid}`,'Remote publication',info);try{publication.setSubscribed?.(true)}catch(error){sendDebug('error','setSubscribed failed',safeError(error))}if(publication.track)attachTrack(publication.track,LiveKit,publication,participant)}}}catch(error){addLog('err',`Remote-Scan Fehler: ${String(error.message||error)}`);sendDebug('error','remote scan failed',safeError(error))}}
async function publishMic(LiveKit){try{await room.localParticipant.setMicrophoneEnabled(true,{echoCancellation:true,noiseSuppression:true,autoGainControl:true});addLog('sys','Mikrofon an LiveKit gesendet.');sendDebug('info','microphone published')}catch(error){addLog('err',`Mikrofon Fehler: ${String(error.message||error)}`);sendDebug('error','microphone publish failed',safeError(error));throw error}}
function installRoomEvents(LiveKit){room.on(LiveKit.RoomEvent.ConnectionStateChanged,state=>addDebug('LiveKit connection_state',state));room.on(LiveKit.RoomEvent.Connected,()=>{setStatus('LiveKit verbunden','ok');sendDebug('info','livekit connected')});room.on(LiveKit.RoomEvent.Disconnected,reason=>{setStatus('Getrennt','bad');addLog('err',`LiveKit getrennt: ${String(reason||'unknown')}`);sendDebug('error','livekit disconnected',{reason})});room.on(LiveKit.RoomEvent.ParticipantConnected,participant=>{addDebug('Participant connected',{identity:participant.identity,metadata:participant.metadata});setTimeout(()=>scanRemoteTracks(LiveKit),250)});room.on(LiveKit.RoomEvent.ParticipantDisconnected,participant=>addDebug('Participant disconnected',{identity:participant.identity}));room.on(LiveKit.RoomEvent.TrackPublished,(publication,participant)=>{addDebug('Track published',publicationInfo(publication,participant));try{publication.setSubscribed?.(true)}catch(error){sendDebug('error','setSubscribed after publish failed',safeError(error))}setTimeout(()=>scanRemoteTracks(LiveKit),250)});room.on(LiveKit.RoomEvent.TrackSubscribed,(track,publication,participant)=>{addDebug('Track subscribed',publicationInfo(publication,participant));attachTrack(track,LiveKit,publication,participant)});room.on(LiveKit.RoomEvent.TrackSubscriptionFailed,(sid,participant,error)=>{addLog('err',`TrackSubscriptionFailed ${String(sid)} ${String(error?.message||error)}`);sendDebug('error','track subscription failed',{sid,participant:participant?.identity,error:safeError(error)})});room.on(LiveKit.RoomEvent.ActiveSpeakersChanged,speakers=>speakUI(speakers.some(participant=>participant.identity!==room.localParticipant.identity)));room.on(LiveKit.RoomEvent.DataReceived,(payload,participant,kind,topic)=>{let text='';try{text=new TextDecoder().decode(payload)}catch{text='[binary]'}addDebug(`DataReceived topic=${topic||'none'} from=${participant?.identity||'unknown'}`,text);try{if(window.LKApp&&window.LKApp._dh){window.LKApp._dh(JSON.parse(text),{from:participant?.identity,topic})}}catch(_){}})}
async function start(){if(started)return;started=true;sendDebug('info','start clicked');tapLayer.style.display='none';hideFallback();loader.classList.add('show');setStatus('Verbinde…');try{const tokenRes=await fetch('/livekit-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({name:'Simon'},window.__startContext||{}))});const session=await tokenRes.json().catch(()=>({parse_error:true,status:tokenRes.status}));addDebug('LiveKit Session',session);if(!tokenRes.ok||!session.livekit_url||!session.token)throw new Error(session.error||JSON.stringify(session));const LiveKit=await getSdk();room=new LiveKit.Room({adaptiveStream:true,dynacast:true});installRoomEvents(LiveKit);setStatus('Verbinde Raum...');await room.connect(session.livekit_url,session.token,{autoSubscribe:true});try{await room.startAudio?.();sendDebug('info','room audio unlocked')}catch(error){sendDebug('warn','room startAudio failed',safeError(error))}addLog('sys',`Raum verbunden: ${session.room} · Agent: ${session.agent_name}`);await publishMic(LiveKit);scanRemoteTracks(LiveKit);scanTimer=setInterval(()=>scanRemoteTracks(LiveKit),1500);setStatus('Avatar wird vorbereitet…','ok');setTimeout(()=>{if(!attachedVideo){loader.classList.remove('show');showFallback('Noch kein Avatar-Video. Verlauf prüfen: Agent/Secrets/Dispatch.');sendDebug('error','no avatar video after timeout',{room:session.room,agent_name:session.agent_name})}},15000)}catch(error){started=false;tapLayer.style.display='block';loader.classList.remove('show');setStatus('Start fehlgeschlagen','bad');showFallback('Start fehlgeschlagen. Antippen zum erneuten Versuch.');addLog('err',String(error.message||error));sendDebug('error','start failed',safeError(error));console.warn(error)}}
video.addEventListener('loadedmetadata',()=>{lastFrameAt=Date.now();markVideoVisible();addDebug('Video metadata',{width:video.videoWidth,height:video.videoHeight,readyState:video.readyState})});video.addEventListener('playing',()=>{lastFrameAt=Date.now();markVideoVisible();sendDebug('info','video playing')});video.addEventListener('resize',()=>addDebug('Video resize',{width:video.videoWidth,height:video.videoHeight}));video.addEventListener('error',()=>{addLog('err',`Video Fehler: ${String(video.error?.message||video.error?.code||'unknown')}`);sendDebug('error','video element error',{code:video.error?.code,message:video.error?.message})});
function openSheet(open){sheet.classList.toggle('open',open)}sheetHandle.addEventListener('click',()=>openSheet(!sheet.classList.contains('open')));document.body.addEventListener('touchstart',event=>{dragY=event.touches[0].clientY},{passive:true});document.body.addEventListener('touchend',event=>{const diff=dragY-event.changedTouches[0].clientY;if(diff>55)openSheet(true);if(diff<-45)openSheet(false)},{passive:true});tapLayer.addEventListener('click',start);tapLayer.addEventListener('touchend',event=>{event.preventDefault();start()},{passive:false});document.body.addEventListener('click',()=>{room?.startAudio?.().catch(()=>{})},{passive:true});
addLog('sys','App bereit. Browser verbindet nur mit LiveKit; LemonSlice läuft im Agent Worker.');sendDebug('info','browser app loaded',{userAgent:navigator.userAgent});
window.LKApp={start,stop:()=>{try{room?.disconnect()}catch(e){}},isStarted:()=>started,getRoom:()=>room,setMuted:async(m)=>{try{await room?.localParticipant?.setMicrophoneEnabled(!m)}catch(e){sendDebug('warn','setMuted failed',safeError(e))}},publishData:async(obj,topic='app')=>{try{const enc=new TextEncoder().encode(JSON.stringify(obj));await room?.localParticipant?.publishData(enc,{reliable:true,topic})}catch(e){sendDebug('warn','publishData failed',safeError(e))}},setDataHandler:(fn)=>{window.LKApp._dh=fn}};
</script>
<script type="module" src="/js/boot.js"></script>
</body>
</html>
