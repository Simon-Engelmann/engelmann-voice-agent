<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Engelmann Voice Agent</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fbfbfd;color:#1d1d1f;min-height:100dvh;display:grid;place-items:center}.card{width:min(520px,88vw);text-align:center}.circle{width:min(420px,78vw);height:min(420px,78vw);border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 28px 80px rgba(0,72,180,.16);margin:0 auto 20px;display:grid;place-items:center}video{width:100%;height:100%;object-fit:cover}.pill{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);color:#6e6e73}.dot{width:8px;height:8px;border-radius:50%;background:#34c759}.bubble{margin-top:14px;padding:12px 14px;border-radius:18px;background:#f1f1f4;text-align:left;white-space:pre-wrap}button{margin-top:16px;border:0;border-radius:16px;background:#007aff;color:white;font:inherit;font-weight:700;padding:14px 18px;min-width:180px}
</style>
</head>
<body>
<div class="card">
  <div class="circle"><video id="avatarVideo" autoplay playsinline muted></video><div id="fallback">Lade LemonSlice...</div></div>
  <div class="pill"><span class="dot"></span><span id="status">Lade App...</span></div>
  <div id="log" class="bubble">Bereit.</div>
  <button id="startBtn">Starten</button>
</div>
<script src="/lemon-app.js?v=1"></script>
</body>
</html>
