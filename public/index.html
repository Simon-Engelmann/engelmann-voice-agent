<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Engelmann Voice Agent</title>
<style>
:root{--bg:#fbfbfd;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--glass:rgba(255,255,255,.78);--ok:#34c759;--bad:#ff3b30}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% 36%,rgba(222,238,255,.98),#fff 48%,var(--bg) 100%)}.app{position:relative;min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:hidden}.aurora{position:absolute;inset:-20%;background:radial-gradient(circle at 24% 34%,rgba(0,122,255,.10),transparent 26%),radial-gradient(circle at 76% 38%,rgba(52,199,89,.10),transparent 30%),radial-gradient(circle at 50% 76%,rgba(90,200,250,.13),transparent 28%);filter:blur(18px);pointer-events:none}.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;max-width:calc(100vw - 24px)}.pill{display:flex;align-items:center;gap:8px;min-height:34px;padding:7px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 10px 28px rgba(0,0,0,.06);font-size:13px;color:var(--muted);white-space:nowrap}.dot{width:8px;height:8px;border-radius:99px;background:#c7c7cc;flex:0 0 auto}.pill.ok .dot{background:var(--ok);box-shadow:0 0 0 6px rgba(52,199,89,.12)}.pill.bad .dot{background:var(--bad);box-shadow:0 0 0 6px rgba(255,59,48,.12)}.stage{position:relative;width:min(88vw,540px);height:min(88vw,540px);display:grid;place-items:center;isolation:isolate}.stage.speaking{transform:translateY(-6px)}.stage:before{content:"";position:absolute;width:78%;height:78%;border-radius:50%;background:radial-gradient(circle at 42% 32%,rgba(255,255,255,.92),rgba(255,255,255,.48) 47%,rgba(0,122,255,.07) 72%,transparent 100%);box-shadow:0 32px 90px rgba(0,72,180,.14),inset 0 1px 0 rgba(255,255,255,.9);z-index:-1}#avatarFrame{position:relative;width:78%;height:78%;border-radius:50%;overflow:hidden;transform:translateZ(0);background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}#avatarVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;background:transparent;opacity:0;transition:opacity .2s ease;z-index:3}#avatarVideo.show{opacity:1}.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:30px;color:var(--muted);font-size:14px;text-align:center;white-space:pre-wrap;line-height:1.35;z-index:4}.hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;color:#b0b0b7;font-size:12px;text-align:center;user-select:none}.hint:before{content:"";display:block;width:42px;height:5px;background:#d1d1d6;border-radius:4px;margin:0 auto 8px}.sheet{position:fixed;left:0;right:0;bottom:0;height:min(74dvh,700px);z-index:30;transform:translateY(calc(100% - 56px));transition:transform .28s cubic-bezier(.2,.8,.2,1);border-radius:30px 30px 0 0;background:rgba(255,255,255,.96);border:1px solid var(--line);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 -28px 70px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden}.sheet.open{transform:translateY(0)}@media (min-width:760px){.sheet{left:50%;right:auto;width:720px;transform:translate(-50%,calc(100% - 56px))}.sheet.open{transform:translate(-50%,0)}}.handle-wrap{padding:10px 18px 8px;text-align:center;user-select:none}.handle{width:48px;height:5px;border-radius:6px;background:#d1d1d6;margin:0 auto 8px}.chat-title{font-weight:700;font-size:15px}.log{flex:1;overflow:auto;padding:10px 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}.entry{max-width:94%;padding:10px 12px;border-radius:16px;line-height:1.35;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.sys{align-self:center;background:#fff8dc;color:#6b5b00;font-size:13px}.err{align-self:center;background:#fff1f0;color:#9f1c15;font-size:13px}.debug{align-self:center;background:#eef6ff;color:#20466b;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.tapLayer{position:fixed;inset:0;z-index:5;background:transparent}.audioSink{display:none}
</style>
</head>
<body>
<div id="root" class="app"><div class="aurora"></div><div class="top"><div id="pill" class="pill"><span class="dot"></span><span id="status">Antippen zum Starten</span></div></div><div id="stage" class="stage"><div id="avatarFrame"><video id="avatarVideo" autoplay playsinline muted></video><div id="fallback" class="fallback">Antippen, Mikrofon erlauben.</div></div></div><div class="hint">Nach oben wischen für Verlauf</div><div id="tapLayer" class="tapLayer"></div><div id="audioSink" class="audioSink"></div></div>
<section id="sheet" class="sheet"><div id="sheetHandle" class="handle-wrap"><div class="handle"></div><div class="chat-title">Verlauf</div></div><div id="log" class="log"></div></section>
<script type="module">
const LIVEKIT_CLIENT_URL='https://esm.sh/livekit-client@2.15.13';
const $=id=>document.getElementById(id);
const video=$('avatarVideo'),fallback=$('fallback'),status=$('status'),pill=$('pill'),stage=$('stage'),tapLayer=$('tapLayer'),sheet=$('sheet'),sheetHandle=$('sheetHandle'),log=$('log'),audioSink=$('audioSink');
let sdk,room,started=false,attachedVideo=null,dragY=0,lastFrameAt=0,scanTimer=null;
const seen=new Set();
function redact(v){if(!v||typeof v!=='object')return typeof v==='string'?v.replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g,'[jwt-redacted]').slice(0,3000):v;if(Array.isArray(v))return v.map(redact);const o={};for(const[k,val]of Object.entries(v)){o[k]=/token|secret|key|authorization|jwt/i.test(k)?'[redacted]':redact(val)}return o}
function sendDebug(level,message,data=null){fetch('/debug-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'browser',level,message,data:redact(data),path:location.pathname})}).catch(()=>{})}
function setStatus(t,m=''){status.textContent=t;pill.classList.toggle('ok',m==='ok');pill.classList.toggle('bad',m==='bad')}
function addLog(kind,text){const el=document.createElement('div');el.className='entry '+kind;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight;if(kind==='err')sendDebug('error',text);return el}
function addDebug(label,obj){let text='';try{text=typeof obj==='string'?obj:JSON.stringify(redact(obj),null,2)}catch(_){text=String(obj)}addLog('debug',label+'\n'+text.slice(0,2200));sendDebug('info',label,obj)}
function debugOnce(key,label,obj){if(seen.has(key))return;seen.add(key);addDebug(label,obj)}
function safeError(e){return{name:e?.name||null,message:String(e?.message||e),stack:e?.stack?String(e.stack).split('\n').slice(0,5).join('\n'):null}}
window.addEventListener('error',e=>sendDebug('error','window error',{message:e.message,source:e.filename,line:e.lineno,column:e.colno,error:safeError(e.error)}));
window.addEventListener('unhandledrejection',e=>sendDebug('error','unhandled rejection',safeError(e.reason)));
function showFallback(text){fallback.style.display='grid';fallback.textContent=text;sendDebug('warn','fallback shown',{text})}
function hideFallback(){fallback.style.display='none'}
function speakUI(on){stage.classList.toggle('speaking',on)}
async function getSdk(){sdk=sdk||await import(LIVEKIT_CLIENT_URL);return sdk}
function publicationInfo(pub,p){return{participant:p?.identity,kind:pub.kind,source:pub.source,name:pub.trackName,sid:pub.trackSid,subscribed:pub.isSubscribed,muted:pub.isMuted,enabled:pub.isEnabled,hasTrack:!!pub.track}}
function markVideoVisible(){video.classList.add('show');hideFallback();setStatus('Avatar verbunden','ok')}
function attachVideoTrack(track,L,pub,p){if(!track||attachedVideo===track)return;attachedVideo=track;try{track.attach(video)}catch(e){addLog('err','Video attach Fehler: '+String(e.message||e));sendDebug('error','video attach failed',safeError(e))}video.autoplay=true;video.playsInline=true;video.muted=true;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.play().catch(e=>{addLog('err','Video play() blockiert: '+String(e.message||e));sendDebug('error','video play failed',safeError(e))});markVideoVisible();addLog('sys','Avatar-Video verbunden: '+(p?.identity||'remote'));debugOnce('video-'+(pub?.trackSid||track.sid),'Video-Track',publicationInfo(pub,p));setTimeout(()=>{if(!lastFrameAt&&video.videoWidth===0)showFallback('Video-Track empfangen, aber noch kein sichtbares Frame. Details im Verlauf.')},8000)}
function attachAudioTrack(track,L,pub,p){try{const el=track.attach();el.autoplay=true;el.playsInline=true;el.controls=false;audioSink.appendChild(el);el.play?.().catch(e=>{addLog('err','Audio play() blockiert: '+String(e.message||e));sendDebug('error','audio play failed',safeError(e))});debugOnce('audio-'+(pub?.trackSid||track.sid),'Audio-Track',publicationInfo(pub,p));speakUI(true);setTimeout(()=>speakUI(false),1200)}catch(e){addLog('err','Audio attach Fehler: '+String(e.message||e));sendDebug('error','audio attach failed',safeError(e))}}
function attachTrack(track,L,pub,p){if(track.kind===L.Track.Kind.Video||pub?.kind===L.Track.Kind.Video)attachVideoTrack(track,L,pub,p);if(track.kind===L.Track.Kind.Audio||pub?.kind===L.Track.Kind.Audio)attachAudioTrack(track,L,pub,p)}
function scanRemoteTracks(L){if(!room)return;try{for(const p of room.remoteParticipants.values()){for(const pub of p.trackPublications.values()){const info=publicationInfo(pub,p);debugOnce('pub-'+pub.trackSid,'Remote publication',info);try{pub.setSubscribed?.(true)}catch(e){sendDebug('error','setSubscribed failed',safeError(e))}if(pub.track)attachTrack(pub.track,L,pub,p)}}}catch(e){addLog('err','Remote-Scan Fehler: '+String(e.message||e));sendDebug('error','remote scan failed',safeError(e))}}
async function publishMic(L){try{await room.localParticipant.setMicrophoneEnabled(true,{echoCancellation:true,noiseSuppression:true,autoGainControl:true});addLog('sys','Mikrofon an LiveKit gesendet.');sendDebug('info','microphone published')}catch(e){addLog('err','Mikrofon Fehler: '+String(e.message||e));sendDebug('error','microphone publish failed',safeError(e));throw e}}
function installRoomEvents(L){room.on(L.RoomEvent.ConnectionStateChanged,state=>addDebug('LiveKit connection_state',state));room.on(L.RoomEvent.Connected,()=>{setStatus('LiveKit verbunden','ok');sendDebug('info','livekit connected')});room.on(L.RoomEvent.Disconnected,reason=>{setStatus('Getrennt','bad');addLog('err','LiveKit getrennt: '+String(reason||'unknown'));sendDebug('error','livekit disconnected',{reason})});room.on(L.RoomEvent.ParticipantConnected,p=>{addDebug('Participant connected',{identity:p.identity,metadata:p.metadata});setTimeout(()=>scanRemoteTracks(L),250)});room.on(L.RoomEvent.ParticipantDisconnected,p=>addDebug('Participant disconnected',{identity:p.identity}));room.on(L.RoomEvent.TrackPublished,(pub,p)=>{addDebug('Track published',publicationInfo(pub,p));try{pub.setSubscribed?.(true)}catch(e){sendDebug('error','setSubscribed after publish failed',safeError(e))}setTimeout(()=>scanRemoteTracks(L),250)});room.on(L.RoomEvent.TrackSubscribed,(track,pub,p)=>{addDebug('Track subscribed',publicationInfo(pub,p));attachTrack(track,L,pub,p)});room.on(L.RoomEvent.TrackSubscriptionFailed,(sid,p,err)=>{addLog('err','TrackSubscriptionFailed '+String(sid)+' '+String(err?.message||err));sendDebug('error','track subscription failed',{sid,participant:p?.identity,error:safeError(err)})});room.on(L.RoomEvent.ActiveSpeakersChanged,speakers=>speakUI(speakers.some(p=>p.identity!==room.localParticipant.identity)));room.on(L.RoomEvent.DataReceived,(payload,p,kind,topic)=>{let text='';try{text=new TextDecoder().decode(payload)}catch(_){text='[binary]'}addDebug('DataReceived topic='+(topic||'none')+' from='+(p?.identity||'unknown'),text)})}
async function start(){if(started)return;started=true;sendDebug('info','start clicked');tapLayer.style.display='none';showFallback('Verbinde mit LiveKit...');setStatus('LiveKit Token...');try{const tokenRes=await fetch('/livekit-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Simon'})});const session=await tokenRes.json().catch(()=>({parse_error:true,status:tokenRes.status}));addDebug('LiveKit Session',session);if(!tokenRes.ok||!session.livekit_url||!session.token)throw new Error(session.error||JSON.stringify(session));const L=await getSdk();room=new L.Room({adaptiveStream:true,dynacast:true});installRoomEvents(L);setStatus('Verbinde Raum...');await room.connect(session.livekit_url,session.token,{autoSubscribe:true});addLog('sys','Raum verbunden: '+session.room+' · Agent: '+session.agent_name);await publishMic(L);scanRemoteTracks(L);scanTimer=setInterval(()=>scanRemoteTracks(L),1500);setStatus('Warte auf Avatar','ok');showFallback('Agent dispatched. Warte auf Avatar-Video...');setTimeout(()=>{if(!attachedVideo){showFallback('Noch kein Avatar-Video. Verlauf prüfen: Agent/Secrets/Dispatch.');sendDebug('error','no avatar video after timeout',{room:session.room,agent_name:session.agent_name})}},15000)}catch(e){started=false;tapLayer.style.display='block';setStatus('Start fehlgeschlagen','bad');showFallback('Start fehlgeschlagen. Antippen zum erneuten Versuch.');addLog('err',String(e.message||e));sendDebug('error','start failed',safeError(e));console.warn(e)}}
video.addEventListener('loadedmetadata',()=>{lastFrameAt=Date.now();markVideoVisible();addDebug('Video metadata',{width:video.videoWidth,height:video.videoHeight,readyState:video.readyState})});video.addEventListener('playing',()=>{lastFrameAt=Date.now();markVideoVisible();sendDebug('info','video playing')});video.addEventListener('resize',()=>addDebug('Video resize',{width:video.videoWidth,height:video.videoHeight}));video.addEventListener('error',()=>{addLog('err','Video Fehler: '+String(video.error?.message||video.error?.code||'unknown'));sendDebug('error','video element error',{code:video.error?.code,message:video.error?.message})});
function openSheet(open){sheet.classList.toggle('open',open)}sheetHandle.addEventListener('click',()=>openSheet(!sheet.classList.contains('open')));document.body.addEventListener('touchstart',e=>{dragY=e.touches[0].clientY},{passive:true});document.body.addEventListener('touchend',e=>{const d=dragY-e.changedTouches[0].clientY;if(d>55)openSheet(true);if(d<-45)openSheet(false)},{passive:true});tapLayer.addEventListener('click',start);tapLayer.addEventListener('touchend',e=>{e.preventDefault();start()},{passive:false});
addLog('sys','App bereit. Browser verbindet nur mit LiveKit; LemonSlice läuft im Agent Worker.');sendDebug('info','browser app loaded',{userAgent:navigator.userAgent});
</script>
</body>
</html>
