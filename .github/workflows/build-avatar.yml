name: Build Avatar GLB

on:
  workflow_dispatch:
  push:
    paths:
      - "public/*FBX*.zip"
      - "public/*OBJ*.zip"
      - "scripts/convert-avatar.py"
      - ".github/workflows/build-avatar.yml"

permissions:
  contents: write

jobs:
  build-avatar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip

      - name: Convert avatar ZIP to GLB
        run: |
          blender -b --python scripts/convert-avatar.py

      - name: Show generated files
        run: |
          ls -lah public/avatar || true

      - name: Commit generated GLB
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/avatar/model.glb
          if git diff --cached --quiet; then
            echo "No avatar changes to commit."
          else
            git commit -m "Build avatar GLB from uploaded assets"
            git push
          fi
