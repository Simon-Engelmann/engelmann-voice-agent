name: Build Avatar GLB

on:
  workflow_dispatch:
  push:
    paths:
      - "public/*OBJ*.zip"
      - ".github/workflows/build-avatar.yml"

permissions:
  contents: write

jobs:
  build-avatar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          npm install -g obj2gltf

      - name: Convert OBJ ZIP to GLB
        run: |
          mkdir -p _avatar_work public/avatar
          unzip -q public/uploads_files_4123772_OBJ.zip -d _avatar_work
          OBJ_FILE=$(find _avatar_work -type f -iname 'NURSE.obj' | head -n 1)
          if [ -z "$OBJ_FILE" ]; then OBJ_FILE=$(find _avatar_work -type f -iname '*.obj' | head -n 1); fi
          echo "Selected OBJ: $OBJ_FILE"
          obj2gltf -i "$OBJ_FILE" -o public/avatar/model.glb -b

      - name: Verify generated GLB
        run: |
          test -f public/avatar/model.glb
          ls -lh public/avatar/model.glb
          size=$(stat -c%s public/avatar/model.glb)
          echo "Avatar GLB size: $size bytes"
          if [ "$size" -le 1000 ]; then exit 1; fi

      - name: Commit generated GLB
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f public/avatar/model.glb
          if git diff --cached --quiet; then
            echo "No avatar changes to commit."
          else
            git commit -m "Build avatar GLB from OBJ assets"
            git push origin HEAD:main
          fi
